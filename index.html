<!doctype html>
<html lang="en" data-theme="sakura">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5f7" />
    <meta
      name="description"
      content="Lumina — a premium, animated Vue 3 + TypeScript dashboard with Sakura, Space and Ocean themes."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9ec3'/%3E%3Cstop offset='1' stop-color='%238b7bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='12' fill='white' fill-opacity='.85'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lumina · Premium Vue Dashboard</title>
    <script>
      ;(function () {
        try {
          var allowed = ['sakura', 'space', 'ocean']
          var theme = localStorage.getItem('lumina-theme')
          if (allowed.indexOf(theme) === -1) theme = 'sakura'
          document.documentElement.dataset.theme = theme
          var raw = localStorage.getItem('lumina-preferences')
          if (raw && JSON.parse(raw).reduceMotion) {
            document.documentElement.classList.add('reduce-motion')
          }
        } catch (error) {
          /* first visit */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
